<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Message For You</title>
    <meta name="description" content="A romantic animated message created especially for you." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,500;1,600&display=swap" rel="stylesheet" />
    <style>
        /* ===== CSS CUSTOM PROPERTIES ===== */
        :root {
            --c-black: #0a0509;
            --c-purple: #1a0b2e;
            --c-pink: #ff8fb1;
            --c-pink-soft: #ffc4d6;
            --c-maroon: #3a0f1f;
            --c-glow: #ff6f9c;
            --c-text: #f5e9ee;
            --dur-word: 1.7s;
            --dur-gap: 0.35s;
            --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
            --radius-lg: 28px;

            /* ---- Apple Liquid Glass ---- */
            --glass-white: rgb(255 255 255 / 13%);
            --glass-border: rgb(255 255 255 / 28%);
            --glass-highlight: rgb(255 255 255 / 42%);
            --glass-shadow: rgb(0 0 0 / 28%);
            --text-primary: #ffffff;
            --text-secondary: rgb(255 255 255 / 72%);
            --accent: #ff6b9d;
        }

        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-primary);
            min-height: 100svh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 15% 20%, rgb(255 91 153 / 35%), transparent 32%),
                radial-gradient(circle at 85% 15%, rgb(114 92 255 / 35%), transparent 30%),
                radial-gradient(circle at 50% 100%, rgb(255 172 92 / 25%), transparent 35%),
                #0e1020;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== BACKGROUND PARTICLES & STARS ===== */
        #particles {
            position: fixed;
            z-index: -1;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.8;
            filter: blur(0.3px);
        }

        #hearts-layer {
            position: fixed;
            z-index: -1;
            inset: 0;
            pointer-events: none;
            opacity: 0.65;
            filter: blur(0.2px);
        }

        .particle {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 196, 214, 0.9), rgba(255, 196, 214, 0) 70%);
            filter: blur(0.5px);
            animation: drift linear infinite;
        }

        @keyframes drift {
            from {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.5;
            }
            to {
                transform: translateY(-110vh) translateX(var(--drift-x, 20px));
                opacity: 0;
            }
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.15;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ===== FLOATING HEARTS ===== */
        .heart {
            position: absolute;
            bottom: -5%;
            color: rgba(255, 143, 177, 0.35);
            filter: blur(0.3px);
            font-size: 1.4rem;
            animation: floatUp linear forwards;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) translateX(var(--sway, 15px)) rotate(20deg);
                opacity: 0;
            }
        }

        /* ===== MAIN WRAPPER ===== */
        main {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ===== SCREENS ===== */
        .screen {
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.8s var(--ease-soft), transform 0.8s var(--ease-soft), visibility 0.8s;
        }

        .screen[hidden] {
            display: none;
        }

        .screen.fade-out {
            opacity: 0;
            transform: scale(0.97);
            pointer-events: none;
        }

        .screen.fade-in {
            opacity: 0;
            animation: screenIn 0.9s var(--ease-soft) forwards;
        }

        @keyframes screenIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== APPLE LIQUID GLASS — CARDS ===== */
        .intro-card,
        #final-stage {
            position: relative;
            isolation: isolate;
            width: min(100% - 2rem, 30rem);
            padding: clamp(1.5rem, 5vw, 3rem);
            overflow: hidden;

            background:
                linear-gradient(135deg, rgb(255 255 255 / 20%), rgb(255 255 255 / 7%));

            border: 1px solid var(--glass-border);
            border-radius: 32px;

            box-shadow:
                0 24px 80px rgb(0 0 0 / 30%),
                inset 0 1px 0 rgb(255 255 255 / 35%),
                inset 0 -1px 0 rgb(255 255 255 / 8%);

            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);

            animation: glass-appear 0.8s ease both;
        }

        /* ---- Glass highlight reflection (top) ---- */
        .intro-card::before,
        #final-stage::before {
            position: absolute;
            z-index: -1;
            inset: 0;
            content: "";
            background:
                linear-gradient(115deg,
                    rgb(255 255 255 / 26%),
                    transparent 24%,
                    transparent 70%,
                    rgb(255 255 255 / 7%)
                );
            pointer-events: none;
        }

        /* ---- Glass glow blob ---- */
        .intro-card::after,
        #final-stage::after {
            position: absolute;
            top: -35%;
            left: -15%;
            width: 70%;
            height: 55%;
            content: "";
            background: rgb(255 255 255 / 13%);
            border-radius: 50%;
            filter: blur(30px);
            transform: rotate(-18deg);
            pointer-events: none;
        }

        @keyframes glass-appear {
            from {
                opacity: 0;
                filter: blur(12px);
                transform: translateY(22px) scale(0.96);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0) scale(1);
            }
        }

        /* ===== INTRO SCREEN ===== */
        .eyebrow {
            margin: 0 0 0.75rem;
            color: rgb(255 255 255 / 62%);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .intro-title {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            font-size: clamp(2rem, 8vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.05em;
            color: #ffffff;
            text-shadow: 0 3px 18px rgb(0 0 0 / 24%);
            margin-bottom: 32px;
        }

        .intro-description {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-label {
            text-align: left;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            color: rgba(245, 233, 238, 0.6);
            padding-left: 4px;
        }

        /* ===== GLASS INPUT ===== */
        #name-input {
            width: 100%;
            min-height: 52px;
            box-sizing: border-box;
            padding: 0 1rem;

            color: #ffffff;
            background: rgb(0 0 0 / 16%);
            border: 1px solid rgb(255 255 255 / 20%);
            border-radius: 17px;
            outline: none;

            box-shadow:
                inset 0 1px 1px rgb(255 255 255 / 12%),
                0 8px 24px rgb(0 0 0 / 10%);

            font-family: 'Poppins', sans-serif;
            font-size: 1rem;

            transition:
                border-color 180ms ease,
                background 180ms ease,
                box-shadow 180ms ease,
                transform 180ms ease;
        }

        #name-input::placeholder {
            color: rgb(255 255 255 / 48%);
        }

        #name-input:hover {
            background: rgb(255 255 255 / 10%);
            border-color: rgb(255 255 255 / 32%);
        }

        #name-input:focus {
            background: rgb(255 255 255 / 12%);
            border-color: rgb(255 255 255 / 65%);
            box-shadow:
                0 0 0 4px rgb(255 107 157 / 18%),
                0 10px 30px rgb(0 0 0 / 16%);
        }

        #name-input[aria-invalid="true"] {
            border-color: #ff5c7a;
            box-shadow: 0 0 0 3px rgb(255 92 122 / 20%);
        }

        #validation-msg {
            min-height: 18px;
            font-size: 0.78rem;
            color: var(--c-pink);
            text-align: left;
            padding-left: 4px;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.35s var(--ease-soft), transform 0.35s var(--ease-soft);
        }

        #validation-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== GLASS BUTTONS ===== */
        .btn,
        .mute-toggle {
            border: 1px solid rgb(255 255 255 / 28%);
            color: #ffffff;
            background:
                linear-gradient(135deg,
                    rgb(255 255 255 / 24%),
                    rgb(255 255 255 / 9%)
                );
            box-shadow:
                inset 0 1px 0 rgb(255 255 255 / 34%),
                0 10px 25px rgb(0 0 0 / 18%);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            transition:
                transform 180ms ease,
                background 180ms ease,
                box-shadow 180ms ease;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            min-height: 50px;
            padding: 0.8rem 1.25rem;
            border-radius: 16px;
        }

        .btn:hover,
        .mute-toggle:hover {
            background:
                linear-gradient(135deg,
                    rgb(255 255 255 / 34%),
                    rgb(255 255 255 / 14%)
                );
            box-shadow:
                inset 0 1px 0 rgb(255 255 255 / 45%),
                0 14px 32px rgb(0 0 0 / 25%);
            transform: translateY(-2px);
        }

        .btn:active,
        .mute-toggle:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background:
                linear-gradient(135deg,
                    rgb(255 107 157 / 85%),
                    rgb(176 82 255 / 72%)
                );
            margin-top: 6px;
        }

        .btn-primary:hover {
            background:
                linear-gradient(135deg,
                    rgb(255 107 157 / 95%),
                    rgb(176 82 255 / 82%)
                );
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 0.85rem;
            padding: 11px 20px;
            min-height: 44px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        /* ===== MUTE TOGGLE (floating glass) ===== */
        .mute-toggle {
            position: fixed;
            z-index: 20;
            top: 1.25rem;
            right: 1.25rem;

            display: grid;
            width: 48px;
            height: 48px;
            padding: 0;
            place-items: center;

            border-radius: 50%;
            font-size: 1.25rem;
            background: rgb(255 255 255 / 12%);
            border: 1px solid rgb(255 255 255 / 20%);
        }

        .mute-toggle.is-muted {
            color: rgb(255 255 255 / 58%);
            background: rgb(0 0 0 / 22%);
        }

        .mute-toggle:focus-visible {
            outline: 2px solid var(--c-pink-soft);
            outline-offset: 2px;
        }

        /* ===== ANIMATION SCREEN ===== */
        #word-stage {
            position: relative;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .word {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: clamp(2.5rem, 12vw, 4.5rem);
            opacity: 0;
            filter: blur(10px);
            transform: translateY(24px) scale(0.85);
            color: var(--text-primary);
        }

        .word.show {
            animation: wordIn var(--dur-word) var(--ease-soft) forwards;
        }

        .word.leave {
            animation: wordOut 0.5s var(--ease-soft) forwards;
        }

        @keyframes wordIn {
            0% {
                opacity: 0;
                filter: blur(10px);
                transform: translateY(24px) scale(0.85);
            }
            35% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(0) scale(1.02);
            }
            70% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(0) scale(1);
            }
        }

        @keyframes wordOut {
            to {
                opacity: 0;
                filter: blur(8px);
                transform: translateY(-16px) scale(0.92);
            }
        }

        .word--accent {
            color: var(--c-pink);
            text-shadow: 0 0 18px rgba(255, 111, 156, 0.55), 0 0 40px rgba(255, 111, 156, 0.25);
        }

        .word--name {
            font-size: clamp(2.8rem, 13vw, 5rem);
            color: var(--c-pink-soft);
            text-shadow: 0 0 24px rgba(255, 196, 214, 0.6), 0 0 50px rgba(255, 111, 156, 0.3);
        }

        .name-glow-ring {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 143, 177, 0.25), transparent 70%);
            opacity: 0;
            animation: ringIn 2s var(--ease-soft) forwards;
            pointer-events: none;
        }

        @keyframes ringIn {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.7;
                transform: scale(1.3);
            }
        }

        .mini-heart-pop {
            position: absolute;
            font-size: 1.1rem;
            color: var(--c-pink-soft);
            opacity: 0;
            animation: popHeart 1.8s var(--ease-soft) forwards;
            pointer-events: none;
        }

        @keyframes popHeart {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.5);
            }
            40% {
                opacity: 0.9;
                transform: translateY(-10px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px) scale(0.8);
            }
        }

        /* ===== FINAL SCREEN ===== */
        #final-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        #final-message {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(1.7rem, 7vw, 2.6rem);
            text-align: center;
            color: var(--c-pink-soft);
            text-shadow: 0 0 20px rgba(255, 143, 177, 0.5), 0 0 50px rgba(255, 111, 156, 0.25);
            opacity: 0;
            transform: scale(0.9);
            animation: finalIn 1.4s var(--ease-soft) forwards, floatSlow 4.5s ease-in-out 1.4s infinite;
        }

        @keyframes finalIn {
            0% {
                opacity: 0;
                filter: blur(8px);
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
        }

        @keyframes floatSlow {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-8px) scale(1.01);
            }
        }

        .final-heart {
            font-size: 1.6rem;
            display: inline-block;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.18);
                opacity: 1;
            }
        }

        .final-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: actionsIn 1s var(--ease-soft) 1s forwards;
        }

        @keyframes actionsIn {
            to {
                opacity: 1;
            }
        }

        /* ===== ACCESSIBILITY ===== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .form-group {
            display: grid;
            gap: 0.5rem;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--c-pink-soft);
            outline-offset: 2px;
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .particle,
            .heart,
            .star {
                display: none !important;
            }

            .word.show {
                animation: none !important;
                opacity: 1 !important;
                filter: blur(0) !important;
                transform: translateY(0) scale(1) !important;
            }

            .word.leave {
                animation: none !important;
                opacity: 0 !important;
            }

            #final-message {
                animation: none !important;
                opacity: 1 !important;
                transform: scale(1) !important;
            }

            .final-actions {
                animation: none !important;
                opacity: 1 !important;
            }

            .name-glow-ring {
                animation: none !important;
                opacity: 0.4 !important;
            }

            .mini-heart-pop {
                animation: none !important;
                opacity: 0 !important;
            }

            .screen.fade-in {
                animation: none !important;
                opacity: 1 !important;
            }

            .screen.fade-out {
                opacity: 0 !important;
                transform: none !important;
            }

            .intro-card,
            #final-stage {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
                filter: none !important;
            }
        }

        /* ===== REDUCED TRANSPARENCY ===== */
        @media (prefers-reduced-transparency: reduce) {
            .intro-card,
            #final-stage,
            .btn,
            .mute-toggle {
                background: #24243a;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
        }
    </style>
</head>

<body>

    <!-- ===== BACKGROUND LAYERS ===== -->
    <div id="particles" aria-hidden="true"></div>
    <div id="hearts-layer" aria-hidden="true"></div>

    <!-- ===== AUDIO CONTROL ===== -->
    <button class="mute-toggle is-muted" id="mute-btn" type="button" aria-pressed="true" aria-label="Unmute audio" title="Unmute audio">
        <span aria-hidden="true">♫</span>
    </button>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main-content">

        <!-- SCREEN 1: INTRO -->
        <section class="screen screen-intro" id="screen-intro" aria-labelledby="intro-title">

            <div class="intro-card">
                <p class="eyebrow">A special message</p>

                <h1 class="intro-title" id="intro-title">
                    A little message for you
                </h1>

                <p class="intro-description">
                    Enter your name to begin.
                </p>

                <form id="name-form" novalidate>
                    <div class="form-group">
                        <label class="field-label" for="name-input">
                            Your name
                        </label>

                        <input type="text" id="name-input" name="name" placeholder="Enter your name..." autocomplete="name" maxlength="40" required aria-required="true" aria-describedby="validation-msg" aria-invalid="false" />

                        <p class="validation-message" id="validation-msg" role="alert" aria-live="polite"></p>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Start <span aria-hidden="true">→</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- SCREEN 2: ANIMATION -->
        <section class="screen screen-animation" id="screen-animation" aria-labelledby="animation-title" aria-live="polite" aria-atomic="true" hidden>

            <h2 class="sr-only" id="animation-title">Message animation</h2>

            <div id="word-stage"></div>
        </section>

        <!-- SCREEN 3: FINAL -->
        <section class="screen screen-final" id="screen-final" aria-labelledby="final-title" hidden>

            <div id="final-stage">
                <h2 id="final-title" class="sr-only">Final message</h2>

                <p id="final-message" aria-live="polite" aria-atomic="true"></p>

                <div class="final-actions">
                    <button type="button" class="btn btn-secondary" id="btn-repeat">
                        <span aria-hidden="true">↻</span> Play again
                    </button>

                    <button type="button" class="btn btn-secondary" id="btn-change">
                        <span aria-hidden="true">✎</span> Change name
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            "use strict";

            /* ---- BACKGROUND PARTICLES & STARS ---- */
            function initBackground() {
                const layer = document.getElementById('particles');
                const frag = document.createDocumentFragment();

                for (let i = 0; i < 18; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 2 + Math.random() * 3;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.setProperty('--drift-x', (Math.random() * 60 - 30) + 'px');
                    p.style.animationDuration = (10 + Math.random() * 12) + 's';
                    p.style.animationDelay = (Math.random() * 10) + 's';
                    frag.appendChild(p);
                }

                for (let i = 0; i < 25; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    s.style.left = Math.random() * 100 + '%';
                    s.style.top = Math.random() * 100 + '%';
                    s.style.animationDelay = (Math.random() * 3) + 's';
                    s.style.animationDuration = (2 + Math.random() * 3) + 's';
                    frag.appendChild(s);
                }

                layer.appendChild(frag);
            }
            initBackground();

            /* ---- DOM REFS ---- */
            const nameForm = document.getElementById('name-form');
            const nameInput = document.getElementById('name-input');
            const validationMsg = document.getElementById('validation-msg');
            const screenIntro = document.getElementById('screen-intro');
            const screenAnim = document.getElementById('screen-animation');
            const screenFinal = document.getElementById('screen-final');
            const wordStage = document.getElementById('word-stage');
            const finalMessage = document.getElementById('final-message');
            const btnRepeat = document.getElementById('btn-repeat');
            const btnChange = document.getElementById('btn-change');
            const muteBtn = document.getElementById('mute-btn');
            const heartsLayer = document.getElementById('hearts-layer');

            let currentName = '';
            let muted = true;
            let animationRunning = false;
            let heartsInterval = null;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* ---- VALIDATION ---- */
            function showValidation(msg) {
                validationMsg.textContent = msg;
                validationMsg.classList.add('show');
                nameInput.setAttribute('aria-invalid', 'true');
            }

            function clearValidation() {
                validationMsg.textContent = '';
                validationMsg.classList.remove('show');
                nameInput.setAttribute('aria-invalid', 'false');
            }

            nameInput.addEventListener('input', clearValidation);

            /* ---- FLOATING HEARTS ---- */
            function spawnHeart() {
                if (reducedMotion) return;
                const h = document.createElement('div');
                h.className = 'heart';
                h.textContent = '♥';
                h.style.left = Math.random() * 100 + '%';
                h.style.setProperty('--sway', (Math.random() * 40 - 20) + 'px');
                h.style.fontSize = (0.9 + Math.random() * 1.2) + 'rem';
                h.style.animationDuration = (6 + Math.random() * 5) + 's';
                heartsLayer.appendChild(h);
                setTimeout(() => h.remove(), 12000);
            }

            function startHearts() {
                if (heartsInterval || reducedMotion) return;
                heartsInterval = setInterval(spawnHeart, 700);
            }

            function stopHearts() {
                clearInterval(heartsInterval);
                heartsInterval = null;
                document.querySelectorAll('.heart').forEach(h => h.remove());
            }

            /* ---- SCREEN TRANSITION ---- */
            function switchScreen(fromEl, toEl) {
                fromEl.classList.add('fade-out');
                const delay = reducedMotion ? 0 : 800;
                setTimeout(() => {
                    fromEl.hidden = true;
                    fromEl.classList.remove('fade-out');
                    toEl.hidden = false;
                    toEl.classList.add('fade-in');
                    setTimeout(() => toEl.classList.remove('fade-in'), 900);
                }, delay);
            }

            /* ---- FORM SUBMIT ---- */
            function handleSubmit(e) {
                e.preventDefault();
                const raw = nameInput.value.trim().replace(/\s+/g, ' ');
                if (!raw) {
                    showValidation('Please enter a name first');
                    nameInput.focus();
                    return;
                }
                if (raw.length < 2) {
                    showValidation('Your name must contain at least 2 characters.');
                    nameInput.focus();
                    return;
                }
                clearValidation();
                currentName = raw;
                switchScreen(screenIntro, screenAnim);
                startHearts();
                setTimeout(runWordSequence, reducedMotion ? 100 : 850);
            }

            nameForm.addEventListener('submit', handleSubmit);

            nameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nameForm.dispatchEvent(new Event('submit'));
                }
            });

            /* ---- WORD SEQUENCE ---- */
            function makeMiniHeart(container) {
                const mh = document.createElement('span');
                mh.className = 'mini-heart-pop';
                mh.textContent = '♥';
                mh.style.left = (40 + Math.random() * 20) + '%';
                mh.style.top = (30 + Math.random() * 20) + '%';
                container.appendChild(mh);
                setTimeout(() => mh.remove(), 1900);
            }

            function showWord(text, opts) {
                return new Promise((resolve) => {
                    wordStage.innerHTML = '';

                    if (opts.withGlowRing) {
                        const ring = document.createElement('div');
                        ring.className = 'name-glow-ring';
                        wordStage.appendChild(ring);
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => makeMiniHeart(wordStage), i * 350);
                        }
                    }

                    const el = document.createElement('span');
                    el.className = 'word' +
                        (opts.accent ? ' word--accent' : '') +
                        (opts.isName ? ' word--name' : '');
                    el.textContent = text;
                    wordStage.appendChild(el);

                    requestAnimationFrame(() => el.classList.add('show'));

                    const holdTime = reducedMotion ? 400 : (opts.duration || 1700);
                    setTimeout(() => {
                        el.classList.remove('show');
                        el.classList.add('leave');
                        setTimeout(resolve, reducedMotion ? 50 : 500);
                    }, holdTime);
                });
            }

            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            async function runWordSequence() {
                if (animationRunning) return;
                animationRunning = true;

                const gap = reducedMotion ? 50 : 350;

                await showWord('I', { duration: 1500 });
                await sleep(gap);
                await showWord('Love', { accent: true, duration: 1600 });
                await sleep(gap);
                await showWord('You', { accent: true, duration: 1600 });
                await sleep(gap);
                await showWord(currentName, { isName: true, withGlowRing: true, duration: 2000 });
                await sleep(gap);

                animationRunning = false;
                showFinal();
            }

            /* ---- FINAL SCREEN ---- */
            function showFinal() {
                finalMessage.innerHTML = '';
                const textNode = document.createTextNode('I Love You, ');
                const nameSpan = document.createElement('span');
                nameSpan.textContent = currentName;
                const heartSpan = document.createElement('span');
                heartSpan.className = 'final-heart';
                heartSpan.textContent = ' ♥';
                heartSpan.setAttribute('aria-hidden', 'true');

                finalMessage.appendChild(textNode);
                finalMessage.appendChild(nameSpan);
                finalMessage.appendChild(heartSpan);

                // restart CSS animation cleanly
                finalMessage.style.animation = 'none';
                void finalMessage.offsetWidth;
                finalMessage.style.animation = '';

                switchScreen(screenAnim, screenFinal);
            }

            /* ---- BUTTONS ---- */
            btnRepeat.addEventListener('click', function() {
                switchScreen(screenFinal, screenAnim);
                setTimeout(runWordSequence, reducedMotion ? 100 : 850);
            });

            btnChange.addEventListener('click', function() {
                stopHearts();
                nameInput.value = '';
                clearValidation();
                switchScreen(screenFinal, screenIntro);
                setTimeout(() => nameInput.focus(), 850);
            });

            /* ---- MUTE TOGGLE ---- */
            muteBtn.addEventListener('click', function() {
                muted = !muted;
                muteBtn.setAttribute('aria-pressed', String(!muted));
                muteBtn.classList.toggle('is-muted', muted);
                const icon = muteBtn.querySelector('span');
                icon.textContent = muted ? '♫' : '♫';
                muteBtn.setAttribute('aria-label', muted ? 'Unmute audio' : 'Mute audio');
                muteBtn.setAttribute('title', muted ? 'Unmute audio' : 'Mute audio');
            });

            /* ---- KEYBOARD SHORTCUT ---- */
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (!screenIntro.hidden) {
                        nameInput.blur();
                    } else if (!screenFinal.hidden) {
                        btnChange.click();
                    }
                }
            });

        })();
    </script>

</body>
</html>
